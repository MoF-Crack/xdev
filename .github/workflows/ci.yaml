name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ""
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: ".exe"
          - os: macos-latest
            goos: darwin
            goarch: arm64
            ext: ""

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      # frontend/embed.go uses //go:embed all:dist; dist is gitignored and must
      # be produced before go build / go test compile the GUI package.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend assets
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Lint
        run: go vet ./...

      - name: Build CLI
        run: go build -ldflags="-s -w" -o xdev${{ matrix.ext }} .

      # Spec 005 FR-004: host state snapshot is enabled by package TestMain
      # (internal/testkit/hostsnapshot). Do not set XDEV_HOST_SNAPSHOT=0 here.
      - name: Test
        run: go test ./... -v -count=1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xdev-${{ matrix.goos }}-${{ matrix.goarch }}
          path: xdev${{ matrix.ext }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # secrets cannot be referenced in step-level `if:`; expose them as job env
    # and gate optional signing on the env values instead.
    env:
      XDEV_SIGNING_PRIVATE_KEY: ${{ secrets.XDEV_SIGNING_PRIVATE_KEY }}
      XDEV_SIGNING_PUBLIC_KEY: ${{ secrets.XDEV_SIGNING_PUBLIC_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend assets
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Sign manifests
        if: env.XDEV_SIGNING_PRIVATE_KEY != ''
        run: |
          mkdir -p keys
          echo "$XDEV_SIGNING_PRIVATE_KEY" > keys/priv.key
          chmod 600 keys/priv.key
          go build -o xdev .
          ./xdev sign-manifests --manifests-dir manifests --priv-key keys/priv.key

      - name: Build all platforms
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          LDFLAGS="-s -w"
          if [ -n "$XDEV_SIGNING_PUBLIC_KEY" ]; then
            LDFLAGS="$LDFLAGS -X github.com/xmdemt/xdev/internal/signer.rootPublicKeyB64=$XDEV_SIGNING_PUBLIC_KEY"
          fi
          VER="${TAG#v}"   # strip leading 'v' → 0.1.0

          # linux-amd64
          GOOS=linux   GOARCH=amd64 go build -ldflags="$LDFLAGS" -o xdev .
          tar -czf "dist/xdev-linux-amd64-v${VER}.tar.gz" xdev
          rm -f xdev

          # linux-arm64
          GOOS=linux   GOARCH=arm64 go build -ldflags="$LDFLAGS" -o xdev .
          tar -czf "dist/xdev-linux-arm64-v${VER}.tar.gz" xdev
          rm -f xdev

          # windows-amd64
          GOOS=windows GOARCH=amd64 go build -ldflags="$LDFLAGS" -o xdev.exe .
          (cd "$(dirname xdev.exe)" && 7z a -tzip "dist/xdev-windows-amd64-v${VER}.zip" xdev.exe) || \
            zip -j "dist/xdev-windows-amd64-v${VER}.zip" xdev.exe
          rm -f xdev.exe

          # darwin-amd64
          GOOS=darwin   GOARCH=amd64 go build -ldflags="$LDFLAGS" -o xdev .
          tar -czf "dist/xdev-darwin-amd64-v${VER}.tar.gz" xdev
          rm -f xdev

          # darwin-arm64
          GOOS=darwin   GOARCH=arm64 go build -ldflags="$LDFLAGS" -o xdev .
          tar -czf "dist/xdev-darwin-arm64-v${VER}.tar.gz" xdev
          rm -f xdev

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
