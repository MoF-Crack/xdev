name: CI
on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOFLAGS: -mod=readonly

jobs:
  build:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ''
            tags: desktop,production,gtk3
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: .exe
            tags: desktop,production
          - os: macos-latest
            goos: darwin
            goarch: arm64
            ext: ''
            tags: desktop,production
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Linux GUI build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Verify dependencies and toolchain
        shell: bash
        run: |
          go mod download
          go mod verify
          bash scripts/ci/check-go-version.sh
      - name: Build frontend assets
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Frontend unit tests
        working-directory: frontend
        run: |
          npm run test:unit -- --maxWorkers=2
          npm test
      - name: Verify desktop bindings
        shell: bash
        run: |
          # The generator CLI also links a Linux GUI backend. Match the
          # project's GTK3 libraries instead of its default GTK4 backend.
          if [[ "$RUNNER_OS" == 'Linux' ]]; then
            go install -tags gtk3 github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
          else
            go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
          fi
          wails3 generate bindings -f '-tags ${{ matrix.tags }},bindings' -ts -d frontend/bindings ./internal/gui
          git diff --exit-code -- frontend/bindings
      # Separate native commands: PowerShell must not let a later successful
      # command hide go vet's non-zero exit status on Windows.
      - name: Lint
        run: go vet ./...
      - name: Test
        run: go test -p=2 ./... -count=1 -timeout 10m
      - name: Cross-platform test compilation
        if: runner.os == 'Linux'
        run: bash scripts/ci/check-cross-compile.sh
      - name: Desktop build
        env:
          XDEV_BUILD_TAGS: ${{ matrix.tags }}
        run: node scripts/build.mjs --skip-audit --skip-frontend --skip-bindings
      - name: Desktop tests
        run: go test -p=2 -tags '${{ matrix.tags }}' ./internal/gui -count=1 -timeout 5m
      - name: Integration tests
        run: go test -p=2 -tags=integration ./internal/integration -count=1 -timeout 10m
      - name: Race detector
        if: runner.os == 'Linux'
        run: go test -p=2 -race ./internal/... -count=1 -timeout 15m
      - name: Release packaging contract tests
        env:
          XDEV_NATIVE_BINARY: ${{ runner.os == 'Windows' && format('{0}/build/bin/xdev.exe', github.workspace) || '' }}
        run: node --test scripts/release/package.test.mjs scripts/release/manifest-overlay.test.mjs scripts/release/native-brand.test.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: xdev-${{ matrix.goos }}-${{ matrix.goarch }}
          path: build/bin/xdev${{ matrix.ext }}
          retention-days: 3

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install Linux runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-0 libwebkit2gtk-4.1-0
      - uses: actions/download-artifact@v7
        with:
          name: xdev-linux-amd64
          path: build/bin
      - run: chmod +x build/bin/xdev
      - run: go test -tags=online ./internal/e2e -count=1 -timeout 15m

  sign-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Validate tag matches product version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(sed -n 's/^const Version = "\([^"]*\)".*/\1/p' internal/version/version.go)
          test "$TAG" = "v$VERSION" || { echo 'Tag and source version differ'; exit 1; }
      - name: Build maintenance command without desktop assets
        run: go build -o xdev-maintenance .
      - name: Sign one immutable manifest input
        env:
          XDEV_SIGNING_PRIVATE_KEY: ${{ secrets.XDEV_SIGNING_PRIVATE_KEY }}
          XDEV_SIGNING_PUBLIC_KEY: ${{ secrets.XDEV_SIGNING_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          test -n "$XDEV_SIGNING_PRIVATE_KEY"
          test -n "$XDEV_SIGNING_PUBLIC_KEY"
          # Check canonical encodings AND the seed/public half before writing
          # either key. The command neither logs nor persists secret values.
          go run ./internal/signer/checkpair
          umask 077
          KEY_DIR=$(mktemp -d)
          trap 'rm -rf -- "$KEY_DIR"' EXIT
          printf '%s' "$XDEV_SIGNING_PRIVATE_KEY" > "$KEY_DIR/priv.key"
          printf '%s\n' "$XDEV_SIGNING_PUBLIC_KEY" > keys/pub.key
          # Also emits the domain-separated complete PM YAML signature.
          ./xdev-maintenance sign-manifests --manifests-dir manifests --priv-key "$KEY_DIR/priv.key"
      - name: Require complete signature coverage
        env:
          XDEV_REQUIRE_SIGNATURE_COVERAGE: '1'
          XDEV_MANIFEST_VERIFY_PUBKEY: ${{ secrets.XDEV_SIGNING_PUBLIC_KEY }}
        run: go test . -count=1 -run 'TestManifestSignatureCoverage|TestEmbeddedSignatures|TestEmbeddedPMSignature|TestPMReleaseVerificationContract|TestManifestsTree'
      - uses: actions/upload-artifact@v7
        with:
          name: signed-release-input
          path: |
            manifests/*.yaml
            manifests/*.yaml.sig
            keys/pub.key
          retention-days: 3

  package-release:
    needs: sign-release
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - runner: windows-latest
            os: windows
            arch: amd64
            ext: .exe
            tags: desktop,production
          - runner: ubuntu-latest
            os: linux
            arch: amd64
            ext: ''
            tags: desktop,production,gtk3
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
            ext: ''
            tags: desktop,production,gtk3
          - runner: macos-latest
            os: darwin
            arch: amd64
            ext: ''
            tags: desktop,production
          - runner: macos-latest
            os: darwin
            arch: arm64
            ext: ''
            tags: desktop,production
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: signed-release-input
          path: build/signed-release-input
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Linux GUI build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install pinned Windows resource generator
        if: runner.os == 'Windows'
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
      - name: Build signed desktop binary
        env:
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: ${{ runner.os == 'Windows' && '0' || '1' }}
          XDEV_BUILD_TAGS: ${{ matrix.tags }}
          XDEV_RELEASE_SIGNING_INPUT_DIR: build/signed-release-input
          CGO_CFLAGS: ${{ matrix.os == 'darwin' && matrix.arch == 'amd64' && '-arch x86_64' || '' }}
          CGO_LDFLAGS: ${{ matrix.os == 'darwin' && matrix.arch == 'amd64' && '-arch x86_64' || '' }}
        run: node scripts/build.mjs --release --skip-audit --skip-bindings
      - name: Verify signed desktop PE resources
        if: runner.os == 'Windows'
        env:
          XDEV_NATIVE_BINARY: ${{ github.workspace }}/build/bin/xdev.exe
        run: node --test scripts/release/native-brand.test.mjs
      - name: Package canonical update archive
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: node scripts/release/package.mjs pack 'build/bin/xdev${{ matrix.ext }}' dist "${TAG#v}" '${{ matrix.os }}' '${{ matrix.arch }}'
      - name: Verify archive through updater consumer
        env:
          XDEV_RELEASE_ARCHIVE_DIR: ${{ github.workspace }}/dist
          XDEV_RELEASE_VERSION: ${{ github.ref_name }}
        run: go test ./internal/update -run '^TestReleaseArchiveContract$' -count=1
      - name: Additional platform packages
        if: runner.os != 'Windows'
        env:
          TAG: ${{ github.ref_name }}
        run: bash scripts/release/platform-packages.sh '${{ matrix.os }}' '${{ matrix.arch }}' "$TAG"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 3

  release:
    needs: package-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v7
        with:
          name: signed-release-input
          path: build/signed-release-input
      - name: Validate all platforms and generate complete checksums
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/release/package.mjs checksums dist "${TAG#v}"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build release checksum signer
        run: go build -trimpath -o xdev-release-signer ./cmd/release-signer
      - name: Sign release checksums
        env:
          TAG: ${{ github.ref_name }}
          XDEV_SIGNING_PRIVATE_KEY: ${{ secrets.XDEV_SIGNING_PRIVATE_KEY }}
        run: ./xdev-release-signer "$TAG" dist/SHA256SUMS build/signed-release-input/keys/pub.key
      - name: Refuse to mutate an already published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --json isDraft --jq '.isDraft' > release-state.txt 2>/dev/null; then
            test "$(cat release-state.txt)" = true || { echo 'Release already published; use a new tag'; exit 1; }
          fi
      - name: Stage complete release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
      - name: Publish validated release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false
