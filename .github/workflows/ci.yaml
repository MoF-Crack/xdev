name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ""
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: ".exe"
          - os: macos-latest
            goos: darwin
            goarch: arm64
            ext: ""

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      # frontend/embed.go uses //go:embed all:dist; dist is gitignored and must
      # be produced before go build / go test compile the GUI package.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend assets
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Lint
        run: go vet ./...

      - name: Build CLI
        run: go build -ldflags="-s -w" -o xdev${{ matrix.ext }} .

      # Spec 005 FR-004: host state snapshot is enabled by package TestMain
      # (internal/testkit/hostsnapshot). Do not set XDEV_HOST_SNAPSHOT=0 here.
      - name: Test
        run: go test ./... -v -count=1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xdev-${{ matrix.goos }}-${{ matrix.goarch }}
          path: xdev${{ matrix.ext }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # secrets cannot be referenced in step-level `if:`; expose them as job env
    # and gate optional signing on the env values instead.
    env:
      XDEV_SIGNING_PRIVATE_KEY: ${{ secrets.XDEV_SIGNING_PRIVATE_KEY }}
      XDEV_SIGNING_PUBLIC_KEY: ${{ secrets.XDEV_SIGNING_PUBLIC_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend assets
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Sign manifests
        if: env.XDEV_SIGNING_PRIVATE_KEY != ''
        run: |
          mkdir -p keys
          echo "$XDEV_SIGNING_PRIVATE_KEY" > keys/priv.key
          chmod 600 keys/priv.key
          go build -o xdev .
          ./xdev sign-manifests --manifests-dir manifests --priv-key keys/priv.key

      - name: Build all platforms
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          LDFLAGS="-s -w"
          if [ -n "$XDEV_SIGNING_PUBLIC_KEY" ]; then
            LDFLAGS="$LDFLAGS -X github.com/xmdemt/xdev/internal/signer.rootPublicKeyB64=$XDEV_SIGNING_PUBLIC_KEY"
          fi
          VER="${TAG#v}"   # strip leading 'v' → 0.1.0

          # linux-amd64
          GOOS=linux   GOARCH=amd64 go build -ldflags="$LDFLAGS" -o xdev .
          tar -czf "dist/xdev-linux-amd64-v${VER}.tar.gz" xdev
          rm -f xdev

          # linux-arm64
          GOOS=linux   GOARCH=arm64 go build -ldflags="$LDFLAGS" -o xdev .
          tar -czf "dist/xdev-linux-arm64-v${VER}.tar.gz" xdev
          rm -f xdev

          # windows-amd64
          GOOS=windows GOARCH=amd64 go build -ldflags="$LDFLAGS" -o xdev.exe .
          (cd "$(dirname xdev.exe)" && 7z a -tzip "dist/xdev-windows-amd64-v${VER}.zip" xdev.exe) || \
            zip -j "dist/xdev-windows-amd64-v${VER}.zip" xdev.exe
          rm -f xdev.exe

          # darwin-amd64
          GOOS=darwin   GOARCH=amd64 go build -ldflags="$LDFLAGS" -o xdev .
          tar -czf "dist/xdev-darwin-amd64-v${VER}.tar.gz" xdev
          rm -f xdev

          # darwin-arm64
          GOOS=darwin   GOARCH=arm64 go build -ldflags="$LDFLAGS" -o xdev .
          tar -czf "dist/xdev-darwin-arm64-v${VER}.tar.gz" xdev
          rm -f xdev

      - name: Build Linux .deb and .rpm packages
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VER="${TAG#v}"   # 0.1.0
          ARCH_DEB_amd64="amd64"
          ARCH_RPM_amd64="x86_64"
          ARCH_DEB_arm64="arm64"
          ARCH_RPM_arm64="aarch64"

          # Install fpm (Ruby gem) — pre-installed Ruby on ubuntu runners
          sudo apt-get update -qq
          sudo apt-get install -y -qq ruby ruby-dev rpm
          sudo gem install fpm --no-document

          for GOARCH in amd64 arm64; do
            # Build the binary for this arch
            eval "DEB_ARCH=\$ARCH_DEB_${GOARCH}"
            eval "RPM_ARCH=\$ARCH_RPM_${GOARCH}"
            GOOS=linux GOARCH="$GOARCH" go build -ldflags="-s -w" -o "xdev-${GOARCH}" .

            # Stage a minimal FHS layout
            PKGROOT="$(mktemp -d)"
            mkdir -p "$PKGROOT/usr/bin"
            cp "xdev-${GOARCH}" "$PKGROOT/usr/bin/xdev"
            chmod +x "$PKGROOT/usr/bin/xdev"

            # .deb
            fpm -s dir -t deb \
              -n xdev -v "$VER" -a "$DEB_ARCH" \
              --description "Cross-platform development environment manager (CLI/TUI/GUI)" \
              --url "https://github.com/MoF-Crack/xdev" \
              --license MIT \
              -C "$PKGROOT" \
              -p "dist/xdev-${VER}-linux-${GOARCH}.deb"

            # .rpm
            fpm -s dir -t rpm \
              -n xdev -v "$VER" -a "$RPM_ARCH" \
              --description "Cross-platform development environment manager (CLI/TUI/GUI)" \
              --url "https://github.com/MoF-Crack/xdev" \
              --license MIT \
              -C "$PKGROOT" \
              -p "dist/xdev-${VER}-linux-${GOARCH}.rpm"

            rm -rf "$PKGROOT" "xdev-${GOARCH}"
          done

      - name: Build Linux AppImage
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set +e
          VER="${TAG#v}"
          # Build the GUI variant (Wails bindings)
          go build -tags bindings -ldflags="-s -w" -o xdev-gui .
          echo "=== go build exit: $? ==="

          # Assemble AppDir
          APPDIR="XDev.AppDir"
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin"
          cp xdev-gui "$APPDIR/usr/bin/xdev-gui"
          chmod +x "$APPDIR/usr/bin/xdev-gui"

          mkdir -p "$APPDIR/usr/share/applications"
          cat > "$APPDIR/usr/share/applications/xdev-gui.desktop" <<'DESKTOP'
          [Desktop Entry]
          Name=XDev
          Comment=Cross-platform development environment manager
          Exec=xdev-gui
          Icon=xdev
          Terminal=false
          Type=Application
          Categories=Development;
          DESKTOP

          mkdir -p "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          cp build/appicon.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/xdev.png"
          # Also place a .DirIcon (required by some AppImage tools)
          cp build/appicon.png "$APPDIR/.DirIcon"

          # AppImage entry point (AppRun must be a file, not a directory)
          cat > "$APPDIR/AppRun" <<'APPRUN'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/xdev-gui" "$@"
          APPRUN
          chmod +x "$APPDIR/AppRun"

          echo "=== AppDir contents ==="
          find "$APPDIR" -type f

          # Download appimagetool
          wget -q -O appimagetool "https://github.com/AppImage/AppImageKit/releases/latest/download/appimagetool-x86_64.AppImage"
          chmod +x appimagetool

          # Extract appimagetool (FUSE not available on GitHub runners)
          echo "=== Extracting appimagetool ==="
          ./appimagetool --appimage-extract
          echo "=== extract exit: $? ==="
          ls -la squashfs-root/ || echo "squashfs-root not found"

          echo "=== Running appimagetool ==="
          export ARCH=x86_64
          squashfs-root/AppRun --appimage-extract-and-run "$APPDIR" "dist/xdev-gui-${VER}-x86_64.AppImage"
          APPIMAGE_EXIT=$?
          echo "=== appimagetool exit: $APPIMAGE_EXIT ==="

          if [ $APPIMAGE_EXIT -ne 0 ]; then
            echo "=== Trying python fallback ==="
            python3 squashfs-root/usr/lib/appimagetool/AppRun --appimage-extract-and-run "$APPDIR" "dist/xdev-gui-${VER}-x86_64.AppImage"
            echo "=== python fallback exit: $? ==="
          fi

          ls -la dist/ || true
          rm -rf "$APPDIR" appimagetool squashfs-root xdev-gui

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  release-macos:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    env:
      XDEV_SIGNING_PRIVATE_KEY: ${{ secrets.XDEV_SIGNING_PRIVATE_KEY }}
      XDEV_SIGNING_PUBLIC_KEY: ${{ secrets.XDEV_SIGNING_PUBLIC_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend assets
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build macOS DMG
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VER="${TAG#v}"
          mkdir -p dist
          LDFLAGS="-s -w"
          if [ -n "$XDEV_SIGNING_PUBLIC_KEY" ]; then
            LDFLAGS="$LDFLAGS -X github.com/xmdemt/xdev/internal/signer.rootPublicKeyB64=$XDEV_SIGNING_PUBLIC_KEY"
          fi

          # Build CLI for both architectures
          GOARCH=amd64 go build -ldflags="$LDFLAGS" -o xdev-amd64 .
          GOARCH=arm64 go build -ldflags="$LDFLAGS" -o xdev-arm64 .

          # Build GUI variant (Wails bindings)
          GOARCH=arm64 go build -tags bindings -ldflags="$LDFLAGS" -o xdev-gui-arm64 .

          # Create DMG for CLI (arm64 universal-ready)
          STAGING="xdev-dmg-staging"
          mkdir -p "$STAGING"
          cp xdev-arm64 "$STAGING/xdev"
          chmod +x "$STAGING/xdev"
          hdiutil create -volname "XDev" -srcfolder "$STAGING" -ov -format UDZO "dist/xdev-darwin-arm64-v${VER}.dmg"
          rm -rf "$STAGING"

          # Create DMG for GUI (arm64)
          mkdir -p "$STAGING"
          cp xdev-gui-arm64 "$STAGING/xdev-gui"
          chmod +x "$STAGING/xdev-gui"
          hdiutil create -volname "XDev GUI" -srcfolder "$STAGING" -ov -format UDZO "dist/xdev-gui-darwin-arm64-v${VER}.dmg"
          rm -rf "$STAGING"

          rm -f xdev-amd64 xdev-arm64 xdev-gui-arm64

      - name: Upload macOS DMG to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true
