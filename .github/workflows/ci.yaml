name: CI

# CI 触发策略（免费额度保护）：
# - tag push (v*)：触发全部 job（build + integration-tests + release）
# - pull_request：触发 build + integration-tests（不触发 release）
# - branch push：不自动触发（需手动 dispatch 或由用户同意后 push tag）
# 详见 docs/versioning-policy.md "提交规则" 和 "免费额度保护"。
on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Manual trigger reason'
        required: false
        default: 'manual'

jobs:
  build:
    # 云端资源节约：超时兜底，防止失控 job 烧分钟数
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ""
            cgo_ldflags: ""
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: ".exe"
            cgo_ldflags: ""
          - os: macos-latest
            goos: darwin
            goarch: arm64
            ext: ""
            # Wails v2.12 的 darwin cgo LDFLAGS 未包含
            # UniformTypeIdentifiers；macOS 26 SDK 下必须显式补上，
            # 否则链接报 _OBJC_CLASS_$_UTType undefined。
            cgo_ldflags: "-framework UniformTypeIdentifiers"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: go.sum

      # 云端资源节约：Go 编译缓存（setup-go 只缓存模块，不缓存 build cache）。
      # 首跑后各 job 的 go build/test 编译时间约减半。
      - name: Go build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~\AppData\Local\go-build
          key: gobuild-${{ matrix.os }}-${{ hashFiles('go.sum') }}
          restore-keys: gobuild-${{ matrix.os }}-

      # frontend/embed.go uses //go:embed all:dist; dist is gitignored and must
      # be produced before go build / go test compile the GUI package.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend assets
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # 第七轮审计 F-44：CI 此前只做 `vite build`，**从不运行前端测试**——
      # 236 个 vitest 用例（含 i18n 键奇偶、订阅泄漏、重入、竞态守卫）全红也能合入，
      # 整套前端守卫退化为「本机自律」。此处补上单元测试门禁。
      #
      # 第八轮审计 R8-04：F-44 只补了 `npx vitest run`，但 `frontend/package.json` 的
      # `"test": "node test/smoke.mjs"` 是**第二套**源码级契约守卫（AppContent 必须渲染
      # CommandPalette/AppShell、抽取后的页面顺序、`v-if="false"` 死分支、导航分组、
      # locale 键奇偶…）。`vite.config.js` 的 `test.include = ['test/**/*.{test,spec}.js']`
      # **不匹配** `smoke.mjs`，且全仓此前没有任何地方调用 `npm test` —— 这套守卫
      # 在 CI 里从不执行。两条命令在同一 working-directory 下依次运行。
      - name: Frontend unit tests
        working-directory: frontend
        run: |
          npx vitest run
          npm test

      - name: Download dependencies
        run: go mod download

      # Spec 001 FR-001: Verify CI Go version matches go.mod
      - name: Verify Go version consistency
        run: bash scripts/ci/check-go-version.sh

      - name: Verify dependencies
        run: go mod verify

      - name: Lint
        run: go vet ./...

      # 20261021 审计 P1-1：`go build` 不编译测试文件，Windows-only 符号
      # 被无 tag 的 _test.go 引用时只有在 Linux/macOS 跑 `go test` 才会暴露。
      # 交叉 GOOS 的 `go vet` 会编译测试文件，是最便宜的防线。
      - name: Cross-platform test compilation (non-Windows)
        if: matrix.os == 'ubuntu-latest'
        run: bash scripts/ci/check-cross-compile.sh

      # Wails 的 Linux 后端需要 GTK3 + WebKit2GTK 开发库（cgo）。
      # ubuntu-latest（24.04）只提供 webkit2gtk-4.1，因此构建标签需带
      # webkit2_41；4.0 在该镜像上不可用。
      - name: Install Linux GUI build deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build CLI
        env:
          CGO_LDFLAGS: ${{ matrix.cgo_ldflags }}
        run: go build -tags desktop,production,webkit2_41 -ldflags="-s -w" -o xdev${{ matrix.ext }} .

      # Spec 005 FR-004: host state snapshot is enabled by package TestMain
      # (internal/testkit/hostsnapshot). Do not set XDEV_HOST_SNAPSHOT=0 here.
      - name: Test
        # -v removed: verbose output inflates log storage with no gate value
        run: go test ./... -count=1

      # 第七轮审计 F-44：仓库多轮工作（票 10/19/44/46）核心即锁与 PATH RMW 竞态，
      # 但 `-race` 在任何工作流中都不存在（本机因 MinGW 8.1.0 与 Go 1.26 race
      # 运行时不兼容而无法执行）。Linux runner 无该限制，是唯一能补上竞态门禁的地方。
      - name: Test with race detector (linux only)
        if: matrix.goos == 'linux'
        run: go test -race ./internal/... -count=1

      - name: Upload artifact
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: xdev-${{ matrix.goos }}-${{ matrix.goarch }}
          path: xdev${{ matrix.ext }}
          # 云端资源节约：仅用于 PR 调试，3 天足够；默认 90 天存储是纯浪费
          retention-days: 3

  integration-tests:
    # Spec 002: Run integration tests with -tags=integration
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: go.sum

      - name: Go build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~\AppData\Local\go-build
          key: gobuild-${{ matrix.os }}-${{ hashFiles('go.sum') }}
          restore-keys: gobuild-${{ matrix.os }}-

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend assets
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Run integration tests
        # -v removed: verbose output inflates log storage with no gate value
        run: go test -tags=integration ./... -count=1 -timeout 25m

  release:
    needs: [build, integration-tests]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # 第七轮审计 F-38（密钥作用域）：**不得**把 XDEV_SIGNING_PRIVATE_KEY 放在
    # 作业级 env —— 作业级 env 对该作业的**所有步骤**可见，于是本作业的
    # `npm ci`（执行 lockfile 中全部依赖的 preinstall/install/postinstall 脚本）
    # 与 `gem install fpm`（执行 rubygems 拉取的 Ruby 代码）都能读到根签名私钥。
    # 攻击者只需投毒**一个**依赖即可为任意 manifest 签发合法签名，而所有已发布
    # 客户端都内嵌对应公钥 → 整条更新链的信任根失守。
    # 私钥只在真正需要它的步骤上做**步骤级** env 注入（见下方 Verify / Sign 两步）；
    # 公钥非机密，可保留作业级（下游 Build 步骤要用它注入 -ldflags）。
    env:
      XDEV_SIGNING_PUBLIC_KEY: ${{ secrets.XDEV_SIGNING_PUBLIC_KEY }}

    steps:
      - uses: actions/checkout@v7

      - name: Check existing release assets
        id: check_assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # Query existing assets for this tag; export the list so build
          # steps can skip artifacts that are already present.
          EXISTING=""
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets >/dev/null 2>&1; then
            EXISTING="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | tr '\n' ' ')"
          fi
          echo "Existing assets: $EXISTING"
          # Export as env var for step-level conditionals
          echo "EXISTING_ASSETS=$EXISTING" >> "$GITHUB_ENV"
          # Also export a per-asset "exists" flag for cleaner if: conditions
          for name in $EXISTING; do
            safe="$(echo "$name" | tr '.-' '__')"
            echo "HAS_${safe}=1" >> "$GITHUB_ENV"
          done

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: go.sum

      - name: Go build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~\AppData\Local\go-build
          key: gobuild-ubuntu-latest-${{ hashFiles('go.sum') }}
          restore-keys: gobuild-ubuntu-latest-

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend assets
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Linux GUI build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Verify signing secrets (hard gate)
        env:
          XDEV_SIGNING_PRIVATE_KEY: ${{ secrets.XDEV_SIGNING_PRIVATE_KEY }}
        run: |
          # Spec 003 FR-001/FR-002: Release must fail if signing keys are missing
          if [ -z "$XDEV_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Missing required secret: XDEV_SIGNING_PRIVATE_KEY"
            exit 1
          fi
          if [ -z "$XDEV_SIGNING_PUBLIC_KEY" ]; then
            echo "::error::Missing required secret: XDEV_SIGNING_PUBLIC_KEY"
            exit 1
          fi
          echo "Signing secrets verified"

      - name: Sign manifests
        env:
          XDEV_SIGNING_PRIVATE_KEY: ${{ secrets.XDEV_SIGNING_PRIVATE_KEY }}
        run: |
          # F-38 纵深：umask + trap 保证私钥落地文件不被同作业后续步骤读取，
          # 且无论成功失败都被清除（与 sign-manifests.yml 同源做法）。
          umask 077
          trap 'rm -f keys/priv.key' EXIT
          mkdir -p keys
          printf '%s' "$XDEV_SIGNING_PRIVATE_KEY" > keys/priv.key
          chmod 600 keys/priv.key
          go build -tags desktop,production,webkit2_41 -o xdev .
          ./xdev sign-manifests --manifests-dir manifests --priv-key keys/priv.key

      - name: Build all platforms
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -X github.com/xmdemt/xdev/internal/version.GitCommit=${GITHUB_SHA} -X github.com/xmdemt/xdev/internal/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [ -n "$XDEV_SIGNING_PUBLIC_KEY" ]; then
            LDFLAGS="$LDFLAGS -X github.com/xmdemt/xdev/internal/signer.rootPublicKeyB64=$XDEV_SIGNING_PUBLIC_KEY"
          fi
          VER="${TAG#v}"   # strip leading 'v' → 0.1.0

          # linux-amd64
          if ! echo "$EXISTING_ASSETS" | grep -qw "xdev-linux-amd64-v${VER}.tar.gz"; then
            GOOS=linux   GOARCH=amd64 go build -tags desktop,production,webkit2_41 -ldflags="$LDFLAGS" -o xdev .
            tar -czf "dist/xdev-linux-amd64-v${VER}.tar.gz" xdev
            rm -f xdev
          else
            echo "SKIP: xdev-linux-amd64-v${VER}.tar.gz already exists"
          fi

          # linux-arm64
          if ! echo "$EXISTING_ASSETS" | grep -qw "xdev-linux-arm64-v${VER}.tar.gz"; then
            GOOS=linux   GOARCH=arm64 go build -tags desktop,production,webkit2_41 -ldflags="$LDFLAGS" -o xdev .
            tar -czf "dist/xdev-linux-arm64-v${VER}.tar.gz" xdev
            rm -f xdev
          else
            echo "SKIP: xdev-linux-arm64-v${VER}.tar.gz already exists"
          fi

          # windows-amd64
          if ! echo "$EXISTING_ASSETS" | grep -qw "xdev-windows-amd64-v${VER}.zip"; then
            CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -tags desktop,production,webkit2_41 -ldflags="$LDFLAGS" -o xdev.exe .
            (cd "$(dirname xdev.exe)" && 7z a -tzip "dist/xdev-windows-amd64-v${VER}.zip" xdev.exe) || \
              zip -j "dist/xdev-windows-amd64-v${VER}.zip" xdev.exe
            rm -f xdev.exe
          else
            echo "SKIP: xdev-windows-amd64-v${VER}.zip already exists"
          fi

          # darwin 资产由 release-macos 原生 job 构建（Wails 需要 cgo，
          # ubuntu 上无法交叉编译）；此处不再交叉构建 darwin。

      - name: Build Linux .deb and .rpm packages
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VER="${TAG#v}"   # 0.1.0
          ARCH_DEB_amd64="amd64"
          ARCH_RPM_amd64="x86_64"
          ARCH_DEB_arm64="arm64"
          ARCH_RPM_arm64="aarch64"

          # Skip entirely if all 4 packages already exist
          SKIP_DEB_AMD64=0; SKIP_RPM_AMD64=0; SKIP_DEB_ARM64=0; SKIP_RPM_ARM64=0
          echo "$EXISTING_ASSETS" | grep -qw "xdev-${VER}-linux-amd64.deb" && SKIP_DEB_AMD64=1
          echo "$EXISTING_ASSETS" | grep -qw "xdev-${VER}-linux-amd64.rpm" && SKIP_RPM_AMD64=1
          echo "$EXISTING_ASSETS" | grep -qw "xdev-${VER}-linux-arm64.deb" && SKIP_DEB_ARM64=1
          echo "$EXISTING_ASSETS" | grep -qw "xdev-${VER}-linux-arm64.rpm" && SKIP_RPM_ARM64=1

          if [ $SKIP_DEB_AMD64 -eq 1 ] && [ $SKIP_RPM_AMD64 -eq 1 ] && [ $SKIP_DEB_ARM64 -eq 1 ] && [ $SKIP_RPM_ARM64 -eq 1 ]; then
            echo "SKIP: all .deb and .rpm packages already exist"
            exit 0
          fi

          # Install fpm (Ruby gem) — pre-installed Ruby on ubuntu runners
          sudo apt-get update -qq
          sudo apt-get install -y -qq ruby ruby-dev rpm
          sudo gem install fpm --no-document

          LDFLAGS="-s -w -X github.com/xmdemt/xdev/internal/signer.rootPublicKeyB64=$XDEV_SIGNING_PUBLIC_KEY"

          for GOARCH in amd64 arm64; do
            eval "DEB_ARCH=\$ARCH_DEB_${GOARCH}"
            eval "RPM_ARCH=\$ARCH_RPM_${GOARCH}"
            eval "SKIP_DEB=\$SKIP_DEB_$(echo $GOARCH | tr a-z A-Z)"
            eval "SKIP_RPM=\$SKIP_RPM_$(echo $GOARCH | tr a-z A-Z)"

            if [ "$SKIP_DEB" -eq 1 ] && [ "$SKIP_RPM" -eq 1 ]; then
              echo "SKIP: linux-$GOARCH deb and rpm already exist"
              continue
            fi

            GOOS=linux GOARCH="$GOARCH" go build -tags desktop,production,webkit2_41 -ldflags="$LDFLAGS" -o "xdev-${GOARCH}" .

            PKGROOT="$(mktemp -d)"
            mkdir -p "$PKGROOT/usr/bin"
            cp "xdev-${GOARCH}" "$PKGROOT/usr/bin/xdev"
            chmod +x "$PKGROOT/usr/bin/xdev"

            if [ "$SKIP_DEB" -ne 1 ]; then
              fpm -s dir -t deb \
                -n xdev -v "$VER" -a "$DEB_ARCH" \
                --description "Cross-platform development environment manager (CLI/TUI/GUI)" \
                --url "https://github.com/MoF-Crack/xdev" \
                --license MIT \
                -C "$PKGROOT" \
                -p "dist/xdev-${VER}-linux-${GOARCH}.deb"
            fi

            if [ "$SKIP_RPM" -ne 1 ]; then
              fpm -s dir -t rpm \
                -n xdev -v "$VER" -a "$RPM_ARCH" \
                --description "Cross-platform development environment manager (CLI/TUI/GUI)" \
                --url "https://github.com/MoF-Crack/xdev" \
                --license MIT \
                -C "$PKGROOT" \
                -p "dist/xdev-${VER}-linux-${GOARCH}.rpm"
            fi

            rm -rf "$PKGROOT" "xdev-${GOARCH}"
          done

      - name: Build Linux AppImage (amd64)
        if: ${{ !contains(env.EXISTING_ASSETS, 'x86_64.AppImage') }}
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VER="${TAG#v}"
          # 单二进制模型：一个产物同时提供 GUI/TUI/CLI（0.4.0 起产物名统一为 xdev-*）
          LDFLAGS="-s -w -X github.com/xmdemt/xdev/internal/signer.rootPublicKeyB64=$XDEV_SIGNING_PUBLIC_KEY"
          GOARCH=amd64 go build -tags desktop,production,webkit2_41 -ldflags="$LDFLAGS" -o xdev .

          # Assemble AppDir
          APPDIR="XDev.AppDir"
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin"
          cp xdev "$APPDIR/usr/bin/xdev"
          chmod +x "$APPDIR/usr/bin/xdev"

          mkdir -p "$APPDIR/usr/share/applications"
          cat > "$APPDIR/usr/share/applications/xdev.desktop" <<'DESKTOP'
          [Desktop Entry]
          Name=XDev
          Comment=Cross-platform development environment manager
          Exec=xdev
          Icon=xdev
          Terminal=false
          Type=Application
          Categories=Development;
          DESKTOP

          # appimagetool looks for a .desktop file in the AppDir root
          cp "$APPDIR/usr/share/applications/xdev.desktop" "$APPDIR/xdev.desktop"

          mkdir -p "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          cp build/appicon.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/xdev.png"
          # appimagetool requires icon files in the AppDir root
          cp build/appicon.png "$APPDIR/xdev.png"
          cp build/appicon.png "$APPDIR/.DirIcon"

          cat > "$APPDIR/AppRun" <<'APPRUN'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/xdev" "$@"
          APPRUN
          chmod +x "$APPDIR/AppRun"

          # F-10: pin appimagetool to an immutable release tag and verify the
          # artifact hash before executing it. The old URL pointed at the
          # mutable "continuous" release of AppImage/AppImageKit, so an upstream
          # republish silently changed one of our build inputs (supply-chain
          # risk: the tool is executed with the packaging directory in scope).
          # SHA-256 measured 2026-09-12 with:
          #   sha256sum appimagetool-x86_64.AppImage
          # and cross-checked against the GitHub release asset digest (API).
          APPIMAGETOOL_TAG="1.9.1"
          APPIMAGETOOL_SHA256="ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"
          wget -O appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_TAG}/appimagetool-x86_64.AppImage"
          # Fails the step (bash -e) if the artifact does not match the pin.
          echo "${APPIMAGETOOL_SHA256}  appimagetool" | sha256sum -c -
          chmod +x appimagetool

          # --appimage-extract-and-run avoids FUSE requirement on CI runners
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run "$APPDIR" "dist/xdev-${VER}-x86_64.AppImage"

          rm -rf "$APPDIR" appimagetool squashfs-root xdev

      - name: Generate SHA256SUMS
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          if ls * 1>/dev/null 2>&1; then
            sha256sum * > SHA256SUMS
            echo "=== SHA256SUMS ==="
            cat SHA256SUMS
          else
            echo "No files to checksum"
          fi

      - name: Generate structured changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Prefer a preinstalled git-cliff; never cargo-install on the
          # release runner (that step has hung CI waiting for crates.io).
          if command -v git-cliff >/dev/null 2>&1; then
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              git-cliff --tag "$TAG" --range "$PREV_TAG..HEAD" -o CHANGELOG-fragment.md || \
                echo "git-cliff failed, using GitHub auto-generated notes"
            else
              echo "No previous tag, using GitHub auto-generated notes"
            fi
          else
            echo "git-cliff not installed, using GitHub auto-generated notes"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            CHANGELOG-fragment.md
          generate_release_notes: true
          overwrite_files: false

  release-macos:
    needs: [build, integration-tests]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    timeout-minutes: 30
    # 第七轮审计 F-38：私钥不进作业级 env（本作业只做非空校验，从不用它签名）。
    env:
      XDEV_SIGNING_PUBLIC_KEY: ${{ secrets.XDEV_SIGNING_PUBLIC_KEY }}

    steps:
      - uses: actions/checkout@v7

      - name: Check existing release assets
        id: check_assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          EXISTING=""
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets >/dev/null 2>&1; then
            EXISTING="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | tr '\n' ' ')"
          fi
          echo "Existing assets: $EXISTING"
          echo "EXISTING_ASSETS=$EXISTING" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: go.sum

      - name: Go build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~\AppData\Local\go-build
          key: gobuild-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: gobuild-${{ runner.os }}-

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend assets
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Verify signing secrets (hard gate)
        env:
          # F-38：本作业不使用私钥签名，仅做存在性硬门禁——因此私钥只在此步骤可见，
          # 不会泄漏给同作业的 `npm ci` / `gem install` 等依赖安装步骤。
          XDEV_SIGNING_PRIVATE_KEY: ${{ secrets.XDEV_SIGNING_PRIVATE_KEY }}
        run: |
          # Spec 003 FR-001/FR-002: Release must fail if signing keys are missing
          if [ -z "$XDEV_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Missing required secret: XDEV_SIGNING_PRIVATE_KEY"
            exit 1
          fi
          if [ -z "$XDEV_SIGNING_PUBLIC_KEY" ]; then
            echo "::error::Missing required secret: XDEV_SIGNING_PUBLIC_KEY"
            exit 1
          fi
          echo "Signing secrets verified"

      - name: Build macOS DMG
        env:
          TAG: ${{ github.ref_name }}
          # Wails v2.12 的 cgo LDFLAGS 缺少该框架；macOS 26 SDK 链接必需。
          CGO_LDFLAGS: "-framework UniformTypeIdentifiers"
        run: |
          VER="${TAG#v}"
          mkdir -p dist
          LDFLAGS="-s -w -X github.com/xmdemt/xdev/internal/version.GitCommit=${GITHUB_SHA} -X github.com/xmdemt/xdev/internal/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [ -n "$XDEV_SIGNING_PUBLIC_KEY" ]; then
            LDFLAGS="$LDFLAGS -X github.com/xmdemt/xdev/internal/signer.rootPublicKeyB64=$XDEV_SIGNING_PUBLIC_KEY"
          fi

          # 单二进制模型（0.3.3+）：GUI DMG 与 CLI DMG 是同一构建产物，
          # 不再重复打包 xdev-gui-*（0.4.0 起产物收口为每平台单件）。
          SKIP_CLI_DMG=0
          echo "$EXISTING_ASSETS" | grep -qw "xdev-darwin-arm64-v${VER}.dmg" && SKIP_CLI_DMG=1

          if [ $SKIP_CLI_DMG -eq 1 ]; then
            echo "SKIP: all macOS DMGs already exist"
            exit 0
          fi

          # Build CLI for both architectures
          GOARCH=amd64 go build -tags desktop,production,webkit2_41 -ldflags="$LDFLAGS" -o xdev-amd64 .
          GOARCH=arm64 go build -tags desktop,production,webkit2_41 -ldflags="$LDFLAGS" -o xdev-arm64 .

          # Create DMG (arm64 universal-ready)
          STAGING="xdev-dmg-staging"
          mkdir -p "$STAGING"
          cp xdev-arm64 "$STAGING/xdev"
          chmod +x "$STAGING/xdev"
          hdiutil create -volname "XDev" -srcfolder "$STAGING" -ov -format UDZO "dist/xdev-darwin-arm64-v${VER}.dmg"
          rm -rf "$STAGING"

          # 保留原有的 tar.gz 资产名（此前由 ubuntu 交叉构建；现在改原生构建）。
          tar -czf "dist/xdev-darwin-amd64-v${VER}.tar.gz" xdev-amd64
          tar -czf "dist/xdev-darwin-arm64-v${VER}.tar.gz" xdev-arm64

          rm -f xdev-amd64 xdev-arm64

      - name: Generate macOS SHA256SUMS
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          # Only generate if there are DMG files (may be empty with incremental)
          if ls *.dmg 1>/dev/null 2>&1; then
            sha256sum *.dmg > SHA256SUMS-darwin
            echo "=== SHA256SUMS-darwin ==="
            cat SHA256SUMS-darwin
          else
            echo "No DMG files to checksum"
          fi

      - name: Upload macOS DMG to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/SHA256SUMS-darwin
          generate_release_notes: true
          overwrite_files: false

  release-arm64:
    needs: [build, integration-tests]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    # 第七轮审计 F-38：私钥不进作业级 env（本作业只做非空校验，从不用它签名）。
    env:
      XDEV_SIGNING_PUBLIC_KEY: ${{ secrets.XDEV_SIGNING_PUBLIC_KEY }}

    steps:
      - uses: actions/checkout@v7

      - name: Check existing release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          EXISTING=""
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets >/dev/null 2>&1; then
            EXISTING="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | tr '\n' ' ')"
          fi
          echo "Existing assets: $EXISTING"
          echo "EXISTING_ASSETS=$EXISTING" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: go.sum

      - name: Go build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~\AppData\Local\go-build
          key: gobuild-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: gobuild-${{ runner.os }}-

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend assets
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Linux GUI build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Verify signing secrets (hard gate)
        env:
          # F-38：本作业不使用私钥签名，仅做存在性硬门禁——私钥只在此步骤可见。
          XDEV_SIGNING_PRIVATE_KEY: ${{ secrets.XDEV_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$XDEV_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Missing required secret: XDEV_SIGNING_PRIVATE_KEY"
            exit 1
          fi
          if [ -z "$XDEV_SIGNING_PUBLIC_KEY" ]; then
            echo "::error::Missing required secret: XDEV_SIGNING_PUBLIC_KEY"
            exit 1
          fi
          echo "Signing secrets verified"

      - name: Build Linux arm64 AppImage
        continue-on-error: true
        if: ${{ !contains(env.EXISTING_ASSETS, 'aarch64.AppImage') }}
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VER="${TAG#v}"
          mkdir -p dist
          go build -tags desktop,production,webkit2_41 -ldflags="-s -w -X github.com/xmdemt/xdev/internal/version.GitCommit=${GITHUB_SHA} -X github.com/xmdemt/xdev/internal/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ) -X github.com/xmdemt/xdev/internal/signer.rootPublicKeyB64=$XDEV_SIGNING_PUBLIC_KEY" -o xdev .

          APPDIR="XDev.AppDir"
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin"
          cp xdev "$APPDIR/usr/bin/xdev"
          chmod +x "$APPDIR/usr/bin/xdev"

          mkdir -p "$APPDIR/usr/share/applications"
          cat > "$APPDIR/usr/share/applications/xdev.desktop" <<'DESKTOP'
          [Desktop Entry]
          Name=XDev
          Comment=Cross-platform development environment manager
          Exec=xdev
          Icon=xdev
          Terminal=false
          Type=Application
          Categories=Development;
          DESKTOP
          cp "$APPDIR/usr/share/applications/xdev.desktop" "$APPDIR/xdev.desktop"

          mkdir -p "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          cp build/appicon.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/xdev.png"
          cp build/appicon.png "$APPDIR/xdev.png"
          cp build/appicon.png "$APPDIR/.DirIcon"

          cat > "$APPDIR/AppRun" <<'APPRUN'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/xdev" "$@"
          APPRUN
          chmod +x "$APPDIR/AppRun"

          # F-10: same pinning as the amd64 job. This job runs on a native
          # arm64 runner (ubuntu-24.04-arm), so it needs the aarch64 artifact,
          # whose SHA-256 was measured separately (2026-09-12) with:
          #   sha256sum appimagetool-aarch64.AppImage
          # and cross-checked against the GitHub release asset digest (API).
          APPIMAGETOOL_TAG="1.9.1"
          APPIMAGETOOL_SHA256="f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158"
          wget -O appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_TAG}/appimagetool-aarch64.AppImage"
          # Fails the step (bash -e) if the artifact does not match the pin.
          echo "${APPIMAGETOOL_SHA256}  appimagetool" | sha256sum -c -
          chmod +x appimagetool

          ARCH=arm64 ./appimagetool --appimage-extract-and-run "$APPDIR" "dist/xdev-${VER}-aarch64.AppImage"

          rm -rf "$APPDIR" appimagetool squashfs-root xdev

      - name: Upload arm64 AppImage to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.AppImage
          generate_release_notes: true
          overwrite_files: false
