name: rust
display_name: Rust (rustup)
description: The Rust language toolchain installer (rustup). Brings rustc, cargo and rustup under one umbrella.
homepage: https://rustup.rs/
category: language
shims:
    - rustup
    - rustc
    - cargo
    - rustdoc
env_vars:
    CARGO_HOME: '{{install}}\.cargo'
    RUSTUP_HOME: '{{install}}\.rustup'
# 2026-10-25（P1）：`cargo install` 把可执行文件装到 $CARGO_HOME/bin。
# 该目录不在安装根下，不追加的话 cargo install 装完的工具找不到。
path_append:
    - '{{CARGO_HOME}}\bin'
versions:
    - version: 1.97.1
      stable: true
      release: "2026-07-29"
      archives:
        - os: windows
          arch: amd64
          format: exe
          url: https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe
          mirror_url: ""
          # rustup-init.exe 是滚动安装器：官方 URL 始终返回最新安装器，
          # 与 rust 工具链版本无关，因此各版本共用同一哈希。
          sha256: 86478e53f769379d7f0ebfa7c9aa97cb76ca92233f79aa2cc0dbee2efaac73c7
          size: 12000000
          strip: 0
          install_kind: executable
          install_args: ["-y", "--no-modify-path", "--default-toolchain", "{{version}}"]
        - os: linux
          arch: x86_64
          format: sh
          url: https://sh.rustup.rs
          mirror_url: https://mirrors.ustc.edu.cn/rustup/rustup-init.sh
          sha256: ""
          size: 15000000
          strip: 0
          install_kind: script
          install_args: ["-y", "--no-modify-path", "--default-toolchain", "{{version}}"]
        - os: darwin
          arch: arm64
          format: sh
          url: https://sh.rustup.rs
