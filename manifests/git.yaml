name: git
display_name: Git
description: Git is a free and open source distributed version control system.
homepage: https://git-scm.com/
category: build
shims:
    - git
    - gitk
    - git-gui
env_vars:
    GIT_HOME: '{{install}}'
# Linux/macOS：上游只发布源码 tar.gz（kernel.org），xdev 的安装器不做源码
# 构建，因此这两个平台不提供 git 归档；请使用系统 git
# （apt install git / xcode-select --install）。
# Windows 使用 Git for Windows 的 MinGit 预编译包。
versions:
    - version: 2.55.0
      stable: true
      release: "2026-07-29"
      archives:
        - os: windows
          arch: amd64
          format: zip
          url: https://github.com/git-for-windows/git/releases/download/v2.55.0.windows.1/MinGit-2.55.0-64-bit.zip
          mirror_url: https://npmmirror.com/mirrors/git-for-windows/v2.55.0.windows.1/MinGit-2.55.0-64-bit.zip
          sha256: "31497e7968196332263459ee319d2524e3ebc5786ab895e2abad34ffdd4f4ebf"
          size: 60000000
          strip: 1
          requires_proxy: true
    - version: 2.47.0
      stable: true
      release: "2024-10-01"
      archives:
        - os: windows
          arch: amd64
          format: zip
          url: https://github.com/git-for-windows/git/releases/download/v2.47.0.windows.1/MinGit-2.47.0-64-bit.zip
          mirror_url: https://npmmirror.com/mirrors/git-for-windows/v2.47.0.windows.1/MinGit-2.47.0-64-bit.zip
          sha256: 6b175d4675bfa7014ba649e3c0976da2a281d89bd9a096f1f41437f9995497a8
          size: 60000000
          strip: 1
          requires_proxy: true
    - version: 2.45.2
      stable: true
      release: "2024-06-01"
      archives:
        - os: windows
          arch: amd64
          format: zip
          url: https://github.com/git-for-windows/git/releases/download/v2.45.2.windows.1/MinGit-2.45.2-64-bit.zip
          mirror_url: https://npmmirror.com/mirrors/git-for-windows/v2.45.2.windows.1/MinGit-2.45.2-64-bit.zip
          sha256: 7ed2a3ce5bbbf8eea976488de5416894ca3e6a0347cee195a7d768ac146d5290
          size: 58000000
          strip: 1
          requires_proxy: true
    - version: 2.43.0
      stable: true
      release: "2023-11-01"
      archives:
        - os: windows
          arch: amd64
          format: zip
          url: https://github.com/git-for-windows/git/releases/download/v2.43.0.windows.1/MinGit-2.43.0-64-bit.zip
          mirror_url: https://npmmirror.com/mirrors/git-for-windows/v2.43.0.windows.1/MinGit-2.43.0-64-bit.zip
          sha256: 1905d93068e986258fafc69517df8fddff829bb2a289c1fa4dcc6cdf720ddf36
          size: 55000000
          strip: 1
          requires_proxy: true
remote:
    type: github
    url: git/git
    path: ""
    pattern: v(\d+\.\d+\.\d+)$
latest: 2.55.0
lts: ""
install_root: ""
