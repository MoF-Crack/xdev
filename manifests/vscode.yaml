# VS Code（Spec 023 T-D1）
#   - Win: 官方 update 端点 zip。实测（1.131.0）zip 顶层为 appx/、bin/、Code.exe ——
#     无统一根目录，必须 strip: 0（strip 1 会丢 Code.exe）。CLI 在 bin/code、bin/code.cmd。
#   - mac: darwin-arm64-dmg 端点（注意 darwin-arm64/stable 返回的是 zip，
#     本 manifest 用 dmg 变体，extractor 的 dmg case 会挂载并复制 .app）
#   - linux: tar.gz（含 VSCode-linux-x64/ 根 → strip 1）
#   - 无 depends（自带完整运行时）
#   - sha256：仅实测 Windows 最新版；其余平台留空（TOFU/sidecar 机制兜底）
name: vscode
display_name: Visual Studio Code
description: Visual Studio Code is a lightweight but powerful source code editor that runs on your desktop.
homepage: https://code.visualstudio.com/
category: development_tools
shims:
  - code
form_factor: [gui, cli]
# Windows GUI 主程序在安装根目录（Code.exe），CLI 在 bin/ 下（shim code 用 bin/code 解析）。
gui_binary: Code.exe
latest: "1.131.0"
lts: ""
versions:
  - version: "1.131.0"
    stable: true
    release: "2026-07-29"
    archives:
      - os: windows
        arch: amd64
        format: zip
        url: https://update.code.visualstudio.com/1.131.0/win32-x64-archive/stable
        mirror_url: ""
        sha256: afcb7f2963cb69b8a251ee275b60da0b74bca70277c103deb029ca73c3a5381e
        size: 335483698
        strip: 0
      - os: darwin
        arch: arm64
        format: dmg
        url: https://update.code.visualstudio.com/1.131.0/darwin-arm64-dmg/stable
        mirror_url: ""
        sha256: ""
        size: 282701877
        strip: 0
      - os: linux
