# T-D7 copilot-cli (Spec 023 Phase D) — 修复：平台包归档。
# 安装策略：xdev 使用 npm 平台包（optionalDependencies 指向的真实二进制包，
# 如 @github/copilot-win32-x64@1.0.77），非 universal loader 薄壳。
# 平台 tgz 根为 package/，strip 1 后 copilot.exe 落在 install 根（integrity 命中），
# 其余资源（node_modules、plugins、queries 等）一并解包到 install 根。
# 版本发现（remote）仍走主包 @github/copilot（版本串一致）；remote 返回
# universal 版本（1.0.77），归档为平台包版本（1.0.77），二者对齐。
# native 安装器（gh.io/copilot-install）作为备选方案存在。
# 包未声明 engines，按 Spec 023 T-D7 约定声明 depends node>=22（install_path: npm）。
# sha256：仅实测 Windows amd64 最新版；其余平台留空（TOFU/sidecar 机制兜底）。
name: copilot-cli
display_name: GitHub Copilot CLI
description: GitHub Copilot CLI brings GitHub Copilot's AI assistance to your terminal, helping you write shell commands and code.
homepage: https://github.com/features/copilot/cli
category: development_tools
shims:
  - copilot
  - github-copilot
form_factor:
  - cli
  - tui
depends:
  - tool: node
    min_version: "22.0.0"
    install_path: npm
latest: "1.0.77"
lts: ""
