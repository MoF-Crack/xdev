# T-D6 codex (Spec 023 Phase D) — 修复：平台包归档。
# 安装策略：xdev 使用 @openai/codex 平台版本 tgz（optionalDependencies 别名
# npm:@openai/codex@0.146.0-win32-x64 指向的真实二进制包），非 universal JS 薄壳。
# 平台 tgz 布局：package/vendor/<triple>/bin/codex.exe（实测 win32-x64 为
# package/vendor/x86_64-pc-windows-msvc/bin/codex.exe）。strip 2 后
# <triple>/bin/codex.exe 落在 install 根下一层（integrity/shim 单层嵌套命中）；
# strip 1 会导致两层嵌套（vendor/<triple>/bin/）integrity 失败，勿改。
# 其余平台布局假设一致（同一构建系统；linux=<vendor>/<triple>/bin/codex）。
# gui 形态由 ChatGPT 桌面应用提供（不在本 manifest 管理范围），故不设置 gui_binary；
# xdev 仅管理 CLI/TUI。
# 重要（本地扫描）：ChatGPT 桌面应用【不提供 codex CLI】——其集成在应用内，
# 不产生名为 codex 的可执行文件，也不会写入 PATH。因此本地扫描（按 shim
# 名称在 PATH / npm 全局 bin 查找）只可能发现独立安装的 codex CLI：
#   - npm 全局安装：npm install -g @openai/codex（Windows 下生成
#     %APPDATA%\npm\codex.cmd，npm 默认将全局 bin 加入 PATH）
#   - 原生安装：installer.codex.com 脚本 / winget
# 仅安装 ChatGPT 桌面应用时扫描不显示 codex 属预期行为，并非扫描故障；
# 也不应将 ChatGPT 桌面应用误判为 codex（它无 CLI 可迁移/激活）。
# depends 声明 node>=16（install_path: npm，包 engines 要求）。
# native 安装（installer.codex.com 脚本 / winget）作为备选方案存在。
# 版本发现（remote）仍走主包 @openai/codex（dist-tags.latest=0.146.0）；
# remote 返回 universal 版本，归档为平台版本（0.146.0-<platform>），前缀对齐。
# sha256：仅实测 Windows amd64 最新版；其余平台留空（TOFU/sidecar 机制兜底）。
name: codex
display_name: Codex (OpenAI)
description: Codex is OpenAI's coding agent that runs in the terminal, helping you build and ship software with AI assistance.
