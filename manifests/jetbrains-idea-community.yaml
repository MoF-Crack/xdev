# JetBrains IntelliJ IDEA Community（Spec 023 T-D2）
#   - Win: 官方安装器 exe（install_kind executable）。静默参数：
#     /S /CONFIG=<config> /D={{install}}——/D 必须是最后一个参数且不带引号。
#     CONFIG 指向安装目录内的 silent.config（须在安装前创建，可为空文件或
#     含 JVM 选项的 vmoptions；不需要自定义 JVM 选项时可移除 /CONFIG 参数，
#     仅用 /S /D={{install}}）。
#   - mac: dmg（extractor 挂载后复制 .app 到 install 根）
#   - linux: tar.gz（含 idea-IIC-*/ 根 → strip 1）
#   - 自带 JBR，无 depends
#   - gui_binary 为单字段：默认 Windows 布局 bin/idea64.exe；
#     Linux 实际入口为 bin/idea.sh（T-C1 启动在 Linux 上需按平台处理）
#   - sha256：仅实测 Windows 最新版；其余平台留空（TOFU/sidecar 机制兜底）
name: jetbrains-idea-community
display_name: JetBrains IntelliJ IDEA Community
description: IntelliJ IDEA Community Edition — the free, open-source Java/Kotlin IDE by JetBrains (bundles its own JBR runtime).
homepage: https://www.jetbrains.com/idea/
category: development_tools
shims:
  - idea
  - idea64
form_factor: [gui, cli]
gui_binary: bin/idea64.exe
latest: "2025.3"
lts: ""
versions:
  - version: "2025.3"
    stable: true
    release: "2025-12-08"
    archives:
      - os: windows
        arch: amd64
        format: exe
        url: https://download.jetbrains.com/idea/idea-2025.3.exe
        mirror_url: ""
        sha256: d7f0310423078c6a3b136c8a04090c1b6d316c2104dc2502d99167feb7ecc1fc
        size: 1108206656
        strip: 0
        install_kind: executable
        install_args: ["/S", "/D={{install}}"]
      - os: darwin
