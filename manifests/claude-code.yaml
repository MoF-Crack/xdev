# T-D4 claude-code (Spec 023 Phase D) — 修复：平台包归档。
# 安装策略：xdev 使用 npm 平台包（optionalDependencies 指向的真实二进制包，
# 如 @anthropic-ai/claude-code-win32-x64@2.1.220），非 universal 薄壳 tgz。
# 平台 tgz 根为 package/，strip 1 后 claude.exe 落在 install 根（integrity 命中）。
# 版本发现（remote）仍走主包 @anthropic-ai/claude-code（版本串一致）；
# remote 返回 universal 版本（2.1.220），归档为平台包版本（2.1.220），二者对齐。
# native 安装脚本（install.sh / install.ps1，installers.claude.com）作为备选方案存在。
# depends 声明 node>=22（install_path: npm）。
# sha256：仅实测 Windows amd64 最新版；其余平台留空（TOFU/sidecar 机制兜底）。
name: claude-code
display_name: Claude Code
description: Claude Code is Anthropic's agentic coding tool that runs in the terminal, helping you plan, build, and ship software with AI assistance.
homepage: https://claude.com/claude-code
category: development_tools
shims:
  - claude
form_factor:
  - cli
  - tui
depends:
  - tool: node
    min_version: "22.0.0"
    install_path: npm
