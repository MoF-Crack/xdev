# T-D3 zed (Spec 023 Phase D)
# 版本源：GitHub releases（zed-industries/zed），latest 稳定版 + 上一稳定版。
# Windows 官方发行物现为 Inno 安装器 exe（Zed-x86_64.exe / Zed-aarch64.exe，
# 二进制内实测 Inno Setup 6.4.3），已无 zip，install_kind executable。
# 静默参数未官方文档化，按 Inno 标准 /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR={{install}}。
# gui_binary zed.exe 布局待核实（无 zip 可查，/DIR 安装后应位于 install 根）。
# mac: dmg（extractor 挂载后复制 .app 到 install 根）；linux: tar.gz（根为 zed.app/ → strip 1）。
# 自带完整运行时，无 depends。
# sha256：仅实测 Windows 最新版；其余平台留空（TOFU/sidecar 机制兜底）。
name: zed
display_name: Zed
description: Zed is a high-performance, multiplayer code editor built by the creators of Atom and Tree-sitter.
homepage: https://zed.dev
category: development_tools
shims:
  - zed
form_factor:
  - gui
  - cli
gui_binary: zed.exe
latest: "1.13.2"
lts: ""
