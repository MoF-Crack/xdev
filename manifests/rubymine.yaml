# JetBrains RubyMine（Spec 023 T-D2）
#   - Win: 官方安装器 exe（install_kind executable）。静默参数：
#     /S /D={{install}}——/D 必须是最后一个参数且不带引号。
#   - mac: dmg（extractor 挂载后复制 .app 到 install 根）
#   - linux: tar.gz（含 RubyMine-*/ 根 → strip 1）
#   - 自带 JBR，无 depends
#   - gui_binary 为单字段：默认 Windows 布局 bin/rubymine64.exe；
#     Linux 实际入口为 bin/rubymine.sh（T-C1 启动在 Linux 上需按平台处理）
#   - sha256：仅实测 Windows 最新版；其余平台留空（TOFU/sidecar 机制兜底）
name: rubymine
display_name: RubyMine
description: RubyMine — the Ruby/Rails IDE by JetBrains, with intelligent code assistance and built-in testing tools (bundles its own JBR runtime).
homepage: https://www.jetbrains.com/ruby/
category: development_tools
shims:
  - rubymine
  - rubymine64
form_factor: [gui, cli]
gui_binary: bin/rubymine64.exe
latest: "2026.2"
lts: ""
versions:
  - version: "2026.2"
    stable: true
    release: "2026-07-21"
    archives:
      - os: windows
        arch: amd64
        format: exe
        url: https://download.jetbrains.com/ruby/RubyMine-2026.2.exe
        mirror_url: ""
        sha256: ace95949354cbd539bed8ebddff0ab45814c2c02143b81cda585cab0d0769bee
        size: 801593856
        strip: 0
        install_kind: executable
        install_args: ["/S", "/D={{install}}"]
      - os: darwin
        arch: arm64
        format: dmg
        url: https://download.jetbrains.com/ruby/RubyMine-2026.2-aarch64.dmg
        mirror_url: ""
        sha256: ""
        size: 999698624
        strip: 0
      - os: linux
        arch: x86_64
        format: tar.gz
        url: https://download.jetbrains.com/ruby/RubyMine-2026.2.tar.gz
        mirror_url: ""
        sha256: ""
        size: 1070534777
