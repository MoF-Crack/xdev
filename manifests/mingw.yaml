name: mingw
display_name: MinGW-w64
description: Minimalist GNU toolchain for Windows cross-compilation. Provides gcc, g++, and binutils targeting Windows.
homepage: https://www.mingw-w64.org/
category: build
shims:
    - x86_64-w64-mingw32-gcc
    - x86_64-w64-mingw32-g++
    - x86_64-w64-mingw32-ld
    - x86_64-w64-mingw32-ar
    - x86_64-w64-mingw32-strip
env_vars:
    MINGW_HOME: '{{install}}'
versions:
    - version: 16.1.0
      stable: true
      release: "2026-07-29"
      archives:
        - os: windows
          arch: amd64
          requires_proxy: true
    - version: 12.2.0
      stable: true
      release: "2022-09-22"
      archives:
        - os: windows
          arch: amd64
          requires_proxy: true
    - version: 11.2.0
      stable: true
      release: "2022-01-20"
      archives:
        - os: windows
          arch: amd64
          requires_proxy: true
remote:
    type: github
    url: "niXman/mingw-builds-binaries"
    path: ""
    pattern: (\d+\.\d+\.\d+)$
latest: 16.1.0
lts: ""
install_root: ""
