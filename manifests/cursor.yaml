# T-D3 cursor (Spec 023 Phase D)
# 版本源实测（2026-08）：
#   - 官方 JSON 更新 API（api2.cursor.sh/updates/v1/update?...）已下线（多平台多参数变体均返回 404 Route not found）。remote 保留该端点作历史引用，
#     refresh 可能失败，版本人工维护（latest 固定于 manifest）。
#   - 现行官方端点：https://api2.cursor.sh/updates/download/golden/<platform>/cursor/<version|latest|stable>
#     302 → downloads.cursor.com 直链（版本编码于文件名，如 CursorSetup-x64-3.14.7.exe）。
#   - winget 包 Anysphere.Cursor（InstallerType: inno，Custom: /mergetasks=!runcode）。
# Windows 官方发行物为 Inno 安装器 exe（无 zip）：install_kind executable。
# 静默参数未官方文档化，按 winget 声明 + Inno 标准采用：
# /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /MERGETASKS=!runcode /DIR={{install}}。
# 若静默安装失败，降级为手动运行安装器（zip 降级说明：官方已不发布 zip）。
# Linux 官方发行物为 AppImage（可执行镜像）：xdev 不管理 AppImage 解包，
# 需手动 chmod +x 运行（降级说明）。
# gui_binary Cursor.exe 布局待核实（/DIR 安装后应位于 install 根）。
