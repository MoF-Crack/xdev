name: go
display_name: Go
description: The Go programming language toolchain.
homepage: https://go.dev/
category: language
shims:
    - go
    - gofmt
    - godoc
env_vars:
    # GOROOT：v2 起不再设置（审计 X-07 / 票 01）。Go 1.26 的 findGOROOT 从
    # go.exe 向上两级自推导 + isGOROOT 校验（pkg/tool 探测），shim 分发的
    # go\bin\go.exe 自推导结果正确；而本 manifest 的归档 strip:0（顶层 go/
    # 目录保留）使 {{install}} 恰比真实 GOROOT 高一层——写它会得到一个没有
    # src/ 的假根，导致 `go build` 报 "package fmt is not in std"。
    # GOPATH：官方默认 ~/go（用户工作区，安装器不设置）。
    # xdev 将其指向 <install_root>\gopath 作为托管工作区
    # （{{install}}\..\gopath 解析为 install 根下的 gopath），
    # 与官方默认不同，属于有意为之的 xdev 托管行为，保持现状。
    GOPATH: '{{install}}\..\gopath'
versions:
    # 升级（安全）：Go 1.26.5 存在中间信任漏洞，默认版本提升到 1.27.3。
    # SHA256 / size 均取自官方索引 https://go.dev/dl/?mode=json，非估算值。
