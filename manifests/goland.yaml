# JetBrains GoLand（Spec 023 T-D2）
#   - Win: 官方安装器 exe（install_kind executable）。静默参数：
#     /S /D={{install}}——/D 必须是最后一个参数且不带引号。
#   - mac: dmg（extractor 挂载后复制 .app 到 install 根）
#   - linux: tar.gz（含 goland-*/ 根 → strip 1）
#   - 自带 JBR，无 depends
#   - gui_binary 为单字段：默认 Windows 布局 bin/goland64.exe；
#     Linux 实际入口为 bin/goland.sh（T-C1 启动在 Linux 上需按平台处理）
#   - sha256：仅实测 Windows 最新版；其余平台留空（TOFU/sidecar 机制兜底）
name: goland
display_name: GoLand
description: GoLand — the IDE for Go by JetBrains, with code completion, refactoring and a built-in debugger (bundles its own JBR runtime).
homepage: https://www.jetbrains.com/go/
category: development_tools
shims:
  - goland
  - goland64
form_factor: [gui, cli]
gui_binary: bin/goland64.exe
latest: "2026.2.0.1"
lts: ""
versions:
