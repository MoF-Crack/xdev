# JetBrains CLion（Spec 023 T-D2）
#   - Win: 官方安装器 exe（install_kind executable）。静默参数：
#     /S /D={{install}}——/D 必须是最后一个参数且不带引号。
#   - mac: dmg（extractor 挂载后复制 .app 到 install 根）
#   - linux: tar.gz（含 clion-*/ 根 → strip 1）
#   - 自带 JBR，无 depends
#   - gui_binary 为单字段：默认 Windows 布局 bin/clion64.exe；
#     Linux 实际入口为 bin/clion.sh（T-C1 启动在 Linux 上需按平台处理）
#   - sha256：仅实测 Windows 最新版；其余平台留空（TOFU/sidecar 机制兜底）
name: clion
display_name: CLion
description: CLion — a cross-platform C/C++ IDE by JetBrains, with CMake integration and a built-in debugger (bundles its own JBR runtime).
homepage: https://www.jetbrains.com/clion/
category: development_tools
shims:
  - clion
  - clion64
form_factor: [gui, cli]
gui_binary: bin/clion64.exe
latest: "2026.2.0.1"
lts: ""
versions:
  - version: "2026.2.0.1"
    stable: true
    release: "2026-07-23"
    archives:
      - os: windows
        arch: amd64
        format: exe
        url: https://download.jetbrains.com/cpp/CLion-2026.2.0.1.exe
        mirror_url: ""
        sha256: 1eb5d666a1f3985cd66a8136e4eb3c3b685ea49e5977977a4ec7c226f240d8ba
        size: 1744101072
        strip: 0
        install_kind: executable
        install_args: ["/S", "/D={{install}}"]
      - os: darwin
        arch: arm64
        format: dmg
