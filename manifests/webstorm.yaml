# JetBrains WebStorm（Spec 023 T-D2）
#   - Win: 官方安装器 exe（install_kind executable）。静默参数：
#     /S /D={{install}}——/D 必须是最后一个参数且不带引号。
#   - mac: dmg（extractor 挂载后复制 .app 到 install 根）
#   - linux: tar.gz（含 WebStorm-*/ 根 → strip 1）
#   - 自带 JBR，无 depends
#   - gui_binary 为单字段：默认 Windows 布局 bin/webstorm64.exe；
#     Linux 实际入口为 bin/webstorm.sh（T-C1 启动在 Linux 上需按平台处理）
#   - sha256：仅实测 Windows 最新版；其余平台留空（TOFU/sidecar 机制兜底）
name: webstorm
display_name: WebStorm
description: WebStorm — the smartest JavaScript IDE by JetBrains, for front-end and full-stack development (bundles its own JBR runtime).
homepage: https://www.jetbrains.com/webstorm/
category: development_tools
shims:
  - webstorm
  - webstorm64
form_factor: [gui, cli]
gui_binary: bin/webstorm64.exe
latest: "2026.2.0.1"
lts: ""
versions:
  - version: "2026.2.0.1"
    stable: true
    release: "2026-07-23"
    archives:
      - os: windows
        arch: amd64
        format: exe
        url: https://download.jetbrains.com/webstorm/WebStorm-2026.2.0.1.exe
        mirror_url: ""
        sha256: 7530b5c01734633e5049ba3fbd2664282febee823f32b967a1e11cc02e71cd41
        size: 870022112
        strip: 0
        install_kind: executable
        install_args: ["/S", "/D={{install}}"]
      - os: darwin
