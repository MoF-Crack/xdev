# T-D5 opencode (Spec 023 Phase D) — 修复：平台包归档。
# 安装策略：xdev 使用 npm 平台包（optionalDependencies 指向的真实二进制包，
# 如 opencode-windows-x64@1.18.11），非 universal 薄壳 tgz。
# 平台 tgz 根为 package/，strip 1 后 bin/opencode.exe 落在 install/bin（integrity 命中）。
# npm 与 Node：平台包自带原生二进制，无需 node 运行时，故不声明 depends。
# 版本发现（remote）仍走主包 opencode-ai（版本串一致）；remote 返回 universal
# 版本（1.18.11），归档为平台包版本（1.18.11），二者对齐。
# GUI：OpenCode 同时提供 Desktop App（gui 形态）；桌面应用安装布局待实施期核实，
# 故不设置 gui_binary，xdev 主要管理 CLI/TUI。
# sha256：仅实测 Windows amd64 最新版；其余平台留空（TOFU/sidecar 机制兜底）。
name: opencode
display_name: OpenCode
description: OpenCode is an open-source AI coding agent that runs in the terminal, IDE, and desktop app, helping you write code across your whole workspace.
homepage: https://opencode.ai
category: development_tools
shims:
  - opencode
form_factor:
  - gui
  - cli
  - tui
