# JetBrains PyCharm Community Edition（Spec 023 T-D2）
#   - Win: 官方安装器 exe（install_kind executable）。静默参数：
#     /S /D={{install}}——/D 必须是最后一个参数且不带引号。
#   - mac: dmg（extractor 挂载后复制 .app 到 install 根）
#   - linux: tar.gz（含 pycharm-community-*/ 根 → strip 1）
#   - 自带 JBR，无 depends
#   - gui_binary 为单字段：默认 Windows 布局 bin/pycharm64.exe；
#     Linux 实际入口为 bin/pycharm.sh（T-C1 启动在 Linux 上需按平台处理）
#   - sha256：仅实测 Windows 最新版；其余平台留空（TOFU/sidecar 机制兜底）
name: pycharm-community
display_name: PyCharm Community
description: PyCharm Community Edition — the free, open-source Python IDE by JetBrains (bundles its own JBR runtime).
homepage: https://www.jetbrains.com/pycharm/
category: development_tools
shims:
  - pycharm
  - pycharm64
form_factor: [gui, cli]
gui_binary: bin/pycharm64.exe
latest: "2025.3"
lts: ""
versions:
  - version: "2025.3"
    stable: true
    release: "2025-12-08"
    archives:
      - os: windows
        arch: amd64
        format: exe
        url: https://download.jetbrains.com/python/pycharm-2025.3.exe
        mirror_url: ""
        sha256: b1e9a363d5e9a4c59f91610e214646291dfd8b77a02b9688a3a291be33557550
        size: 887691448
        strip: 0
        install_kind: executable
        install_args: ["/S", "/D={{install}}"]
      - os: darwin
        arch: arm64
        format: dmg
        url: https://download.jetbrains.com/python/pycharm-2025.3-aarch64.dmg
        mirror_url: ""
        sha256: ""
        size: 1144074862
        strip: 0
      - os: linux
        arch: x86_64
        format: tar.gz
        url: https://download.jetbrains.com/python/pycharm-2025.3.tar.gz
        mirror_url: ""
        sha256: ""
