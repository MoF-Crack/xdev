<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Content-Security-Policy hardening: the app has no dynamic HTML
         sinks today; this policy ensures a future v-html/innerHTML would
         be blocked rather than silently exploitable. Wails serves the
         bundle from the wails:// origin ('self'); inline styles remain
         allowed because Naive UI injects scoped style elements. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-src 'none'">
    <title>XDev</title>
    <link rel="icon" type="image/svg+xml" href="/src/assets/logo-small.svg">
    <style>
        /* Pre-mount dark background to prevent white flash before Vue mounts.
           After mount, theme.css + data-theme attribute take over. */
        html, body {
            margin: 0;
            padding: 0;
            background-color: #0e1116;
            color: #e8ecf3;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
        }
        #app {
            min-height: 100vh;
            background-color: #0e1116;
        }
        /* Pre-mount loading indicator */
        .pre-mount {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #0e1116;
            color: #9aa5b8;
            font-size: 14px;
            gap: 16px;
        }
        .pre-mount-text {
            letter-spacing: 2px;
            opacity: 0;
            animation: preMountFadeIn 0.6s ease forwards;
        }
        .pre-mount-bar {
            width: 120px;
            height: 2px;
            background: rgba(92, 156, 255, 0.13);
            border-radius: 1px;
            overflow: hidden;
            position: relative;
        }
        .pre-mount-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: -40%;
            width: 40%;
            height: 100%;
            background: linear-gradient(90deg, transparent, #5c9cff, transparent);
            border-radius: 1px;
            animation: preMountSlide 1.4s ease-in-out infinite;
        }
        @keyframes preMountFadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes preMountSlide {
            0%   { left: -40%; }
            100% { left: 100%; }
        }
        @media (prefers-reduced-motion: reduce) {
            .pre-mount-text { opacity: 1; animation: none; }
            .pre-mount-bar::after { left: 30%; animation: none; }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="pre-mount">
            <span class="pre-mount-text">Loading XDev…</span>
            <div class="pre-mount-bar"></div>
        </div>
    </div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
